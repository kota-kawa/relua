services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alljob}
      POSTGRES_USER: ${POSTGRES_USER:-alljob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alljob_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alljob} -d ${POSTGRES_DB:-alljob}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://alljob:alljob_dev_password@db:5432/alljob}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:-local-development-internal-token}
      MCP_API_TOKEN: ${MCP_API_TOKEN:-local-development-mcp-token}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:8000}
      MCP_OPERATOR_PASSWORD: ${MCP_OPERATOR_PASSWORD:-local-development-operator-password}
      SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3100}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_LOOPBACK_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3100}
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN:-local-development-internal-token}
    depends_on:
      - api
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3100}:3000"

volumes:
  postgres_data:
  redis_data:
