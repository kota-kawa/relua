server {
    server_name relua.net www.relua.net;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 2m;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/relua.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/relua.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.relua.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = relua.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name relua.net www.relua.net;
    return 404; # managed by Certbot




}