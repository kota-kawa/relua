name: CI / CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: relua-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: relua_test
          POSTGRES_USER: relua
          POSTGRES_PASSWORD: relua_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relua -d relua_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite://
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term-missing
      - name: Verify PostgreSQL migration
        env:
          DATABASE_URL: postgresql+psycopg://relua:relua_test_password@localhost:5432/relua_test
        run: |
          alembic upgrade head
          pytest tests/test_pg_trgm_migration.py
          python -c "from app import models; from app.db import Base, engine; Base.metadata.drop_all(engine)"
      - name: Test PostgreSQL relevance search
        env:
          DATABASE_URL: postgresql+psycopg://relua:relua_test_password@localhost:5432/relua_test
        run: pytest tests/test_opportunities.py -k "relevance or trigram"
      - name: Test PostgreSQL company profile writes
        env:
          DATABASE_URL: postgresql+psycopg://relua:relua_test_password@localhost:5432/relua_test
        run: pytest tests/test_mcp_tools.py tests/test_companies.py -k "company_profile"

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # eslint does not typecheck and vitest does not either, so two real TypeScript
      # errors sat in the tree unnoticed until someone ran tsc by hand.
      - run: npm run typecheck
      - run: npm test
      # next build inlines NEXT_PUBLIC_* into every statically generated page, so the
      # build refuses to run without a public origin rather than baking in localhost.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3100

  docs:
    name: Docs & Env Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Paths named in AGENTS.md / ARCHITECTURE.md / docs must exist, and .env.example must list
      # exactly the variables config.py, the frontend and docker-compose.yml read.
      - run: python3 scripts/check_doc_paths.py
      - run: python3 scripts/check_env_documentation.py

  deploy:
    name: Deploy (main push)
    runs-on: ubuntu-latest
    needs: [backend, frontend, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Validate deployment secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Required GitHub secrets are missing: ${missing[*]}"
            exit 1
          fi

      - name: Configure SSH key
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SERVER_SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          port="${SERVER_PORT:-22}"
          ssh-keyscan -p "${port}" -H "${SERVER_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy via SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          port="${SERVER_PORT:-22}"
          : "${DEPLOY_PATH:?DEPLOY_PATH secret is required}"

          ssh -i ~/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=accept-new -p "${port}" "${SERVER_USER}@${SERVER_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' bash -seu" <<'REMOTE_SCRIPT'
          set -euo pipefail

          cd "${DEPLOY_PATH}"

          if [ ! -d .git ]; then
            echo "Deployment path is not a git checkout: ${DEPLOY_PATH}" >&2
            exit 1
          fi

          if [ ! -f .env ]; then
            echo ".env is missing at ${DEPLOY_PATH}. Create it on the server before deploying." >&2
            exit 1
          fi

          PREV_COMMIT="$(git rev-parse HEAD)"

          compose_up() {
            docker compose up -d --build
          }

          diagnose() {
            echo "--- Deployment Diagnostics ---"
            docker compose ps || true
            docker compose logs api frontend --tail=100 || true
          }

          rollback() {
            echo "Deploy failed. Rolling back to ${PREV_COMMIT}"
            git reset --hard "${PREV_COMMIT}"
            compose_up || true
          }

          on_error() {
            trap - ERR
            diagnose
            rollback
          }

          trap on_error ERR

          # 最新のmainブランチを取得
          git fetch origin main
          git reset --hard origin/main

          # コンテナのビルドと再起動
          compose_up

          # サービスの起動状態を確認
          docker compose ps

          wait_for_service() {
            service="$1"
            retries="${2:-30}"
            while [ "${retries}" -gt 0 ]; do
              cid="$(docker compose ps -q "${service}")"
              if [ -z "${cid}" ]; then
                echo "Service ${service} container is missing." >&2
                return 1
              fi

              status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "${cid}")"
              if [ "${status}" = "healthy" ] || [ "${status}" = "running" ]; then
                echo "Service ${service} is ${status}"
                return 0
              fi
              if [ "${status}" = "unhealthy" ] || [ "${status}" = "exited" ] || [ "${status}" = "dead" ]; then
                echo "Service ${service} is ${status}" >&2
                return 1
              fi

              sleep 2
              retries=$((retries - 1))
            done

            echo "Timed out waiting for service ${service} to become ready." >&2
            return 1
          }

          for service in db redis api frontend; do
            wait_for_service "${service}" 45
          done

          # 古いイメージの削除
          trap - ERR
          docker image prune -f || true
          REMOTE_SCRIPT
